<html lang="en">

<style>
/* Layout: the sales lookup's quiet white page and banknote-green engraving, turned toward the practice:
   one search, then one answer in a sentence, a yearly figure, a row per code, and a way to reach RSK. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #141413;
  --muted: #74746f;
  --line: #e9e8e3;
  --soft: #f4f3ef;
  --art: #1e5b40;
  --below: #b03a1c;
  --below-soft: #fbe9e3;
  --above: #1e5b40;
  --above-soft: #e6f0ea;
  --hover: #f7f6f2;
  --btn-fg: #ffffff;
  --f-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); background: var(--bg); font-family: var(--f-sans); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 0;
}
.page { max-width: 1120px; margin: 0 auto; }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.93rem; letter-spacing: -0.01em; white-space: nowrap; }
.brand svg { color: var(--art); }
.tabs { display: flex; gap: 22px; }
.tabs button { font: inherit; font-size: 0.86rem; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer; white-space: nowrap; transition: color 0.15s; }
.tabs button:hover, .tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button:focus-visible { outline: 2px solid var(--art); outline-offset: 4px; border-radius: 2px; }

/* The engraving: a canvas-drawn mask, inked with one token so it follows the theme */
.scene { position: relative; overflow: hidden; height: clamp(220px, 46vh, 440px); }
.scene .art { position: absolute; inset: 0; background: var(--art);
  -webkit-mask: var(--scene) center / cover no-repeat; mask: var(--scene) center / cover no-repeat; }
.scene.low { height: 170px; }
.scene.low .art { -webkit-mask-position: center 62%; mask-position: center 62%; }
.balloon { position: absolute; top: 12%; left: 30%; width: 34px; color: var(--art); }
.balloon .skin { fill: var(--bg); }
@media (prefers-reduced-motion: no-preference) {
  .balloon { animation: cross 120s linear -36s infinite; }
  .balloon svg { animation: bob 7s ease-in-out infinite alternate; }
  @keyframes cross { from { left: -6%; } to { left: 104%; } }
  @keyframes bob { to { transform: translateY(14px); } }
}

.hero, h1 { display: none; }
h1 { font-family: var(--f-serif); font-weight: 400; font-size: clamp(2.1rem, 4.4vw, 3.2rem); letter-spacing: -0.02em; line-height: 1.05; margin: 0; }
body.home .hero { display: block; }
body.home h1 { display: block; }
body.home .intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 20px 40px; align-items: end; padding-block: 30px 8px; }

/* Search */
.search { position: relative; max-width: 560px; }
body.home .search { max-width: none; }
.search input { width: 100%; font: inherit; font-size: 0.98rem; color: var(--ink); background: var(--soft); border: 1px solid transparent; border-radius: 999px; padding: 12px 52px 12px 18px; transition: border-color 0.15s, background 0.15s; }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--ink); background: var(--bg); }
.search input::-webkit-search-cancel-button { display: none; }
.go { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--ink); color: var(--btn-fg); display: grid; place-items: center; cursor: pointer; }
.go svg { transition: transform 0.2s; }
.go:hover svg { transform: translateX(2px); }
.go:focus-visible { outline: 2px solid var(--art); outline-offset: 3px; }
.results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 5; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px -20px rgba(0, 0, 0, 0.35); max-height: 400px; overflow-y: auto; padding: 5px; }
.results button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.results button:hover, .results button.on, .results button:focus-visible { background: var(--soft); }
.results .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .tag { color: var(--muted); font-size: 0.82rem; display: flex; align-items: center; gap: 8px; justify-content: flex-end; white-space: nowrap; }
.results .sub { grid-column: 1 / -1; color: var(--muted); font-size: 0.8rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .sub b { font-weight: 400; font-variant-numeric: tabular-nums; }
.results .none { padding: 10px 12px; color: var(--muted); }
/* Payer picker: a quiet segmented control over the search; the search, the verdict and every note follow it */
.payers { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; font-size: 0.86rem; color: var(--muted); }
.payers[hidden] { display: none; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--soft); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg label { position: relative; flex: none; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg .opt { display: block; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; white-space: nowrap; transition: color 0.15s, background 0.15s, box-shadow 0.15s; }
.seg label:hover .opt { color: var(--ink); }
.seg input:checked + .opt { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--line); }
.seg input:focus-visible + .opt { outline: 2px solid var(--art); outline-offset: -2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.chip { font-size: 0.74rem; font-weight: 500; padding: 1px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.chip.low { background: var(--below-soft); color: var(--below); }
.chip.high { background: var(--above-soft); color: var(--above); }
.chip.even { background: var(--soft); color: var(--muted); }

/* The rate sheet: no card, only rules */
#view-look { display: grid; gap: 12px; min-width: 0; }
[hidden] { display: none !important; }
.sheet { display: grid; gap: 28px; min-width: 0; border-top: 1px solid var(--line); padding-top: 30px; }
.sheet > .sub { margin: -22px 0 0; color: var(--muted); font-size: 0.9rem; }
.listed p { margin: 0 0 10px; max-width: 62ch; line-height: 1.55; }
.listed p:last-child { margin-bottom: 0; }
.sheet > .cta { justify-self: start; }
#view-camp { border-top: 0; padding-top: 12px; }
.ghead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px 40px; align-items: flex-end; }
.ghead > div { min-width: 0; }
.ghead h2 { font-family: var(--f-serif); font-weight: 400; font-size: clamp(1.9rem, 4vw, 2.7rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 10px; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 2px 18px; color: var(--muted); font-size: 0.88rem; }
.facts b { color: var(--ink); font-weight: 500; }
.facts .mono { font-variant-numeric: tabular-nums; }
.sheet h2:focus { outline: none; }
/* The same practice in another payer's files */
.also { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 10px; font-size: 0.88rem; }
.sheet > .also { margin-top: 0; }
.also[hidden] { display: none; }
.also a { color: var(--art); font-weight: 500; text-decoration: underline 1px color-mix(in srgb, var(--art) 35%, transparent); text-underline-offset: 4px; }
.also a:hover { text-decoration-color: currentColor; }
.also a:focus-visible { outline: 2px solid var(--art); outline-offset: 3px; border-radius: 2px; }
.badges { display: flex; gap: 14px 36px; align-items: flex-end; flex-wrap: wrap; }
.money { display: grid; line-height: 1.15; }
.money .amt { font-family: var(--f-serif); font-size: 2.5rem; letter-spacing: -0.02em; line-height: 1; }
.money span:last-child { color: var(--muted); font-size: 0.8rem; }
.verdict { display: flex; gap: 10px; align-items: flex-end; font-size: 0.8rem; line-height: 1.3; color: var(--muted); }
.verdict .big { font-family: var(--f-serif); font-size: 2.5rem; line-height: 1; letter-spacing: -0.02em; color: var(--below); }
.netpick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.86rem; color: var(--muted); }
.netpick b { color: var(--ink); font-weight: 500; }
.na.lowest { display: block; font-size: 0.72rem; white-space: nowrap; }
.results .tryp button { display: inline; width: auto; font: inherit; color: var(--art); background: none; border: 0; padding: 0 2px; text-decoration: underline; cursor: pointer; }
select { font: inherit; font-size: 0.86rem; color: var(--ink); background: var(--soft); border: 1px solid transparent; border-radius: 999px; padding: 7px 12px; cursor: pointer; max-width: 100%; }
select:focus-visible { outline: 2px solid var(--art); outline-offset: 2px; }

.email { border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 18px; }
.email p { margin: 0; max-width: 70ch; }
.email #line { white-space: pre-line; font-size: 1rem; line-height: 1.75; }
.email #line mark { background: color-mix(in srgb, var(--art) 16%, transparent); color: inherit; padding: 1px 4px; border-radius: 4px; }
.email .ask { color: var(--muted); font-size: 0.86rem; border-top: 1px solid var(--line); padding-top: 16px; }
.email .ask b { color: var(--ink); font-weight: 500; }
.row { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 500; font-size: 0.86rem; padding: 9px 16px; border-radius: 999px; cursor: pointer; border: 0; background: var(--ink); color: var(--btn-fg); transition: opacity 0.15s, background 0.15s; }
.btn:hover { opacity: 0.82; }
.btn.ghost { background: var(--soft); color: var(--ink); }
.btn.ghost:hover { opacity: 1; background: var(--line); }
.btn:focus-visible { outline: 2px solid var(--art); outline-offset: 3px; }
.toast { color: var(--muted); font-size: 0.84rem; }

.tablewrap { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.93rem; color: var(--ink); }
th { text-align: left; font-size: 0.8rem; color: var(--muted); font-weight: 400; padding: 0 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 13px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.code { font-variant-numeric: tabular-nums; font-weight: 500; }
.gapcell { display: inline-flex; align-items: center; gap: 12px; justify-content: flex-end; }
.gap { font-weight: 500; min-width: 3.2em; }
.gap.low { color: var(--below); }
.gap.high { color: var(--above); }
/* tick = state median, dot = this practice */
.gauge { position: relative; width: 72px; height: 12px; flex: none; color: var(--muted); }
.gauge::before { content: ""; position: absolute; left: 0; right: 0; top: 5.5px; height: 1px; background: var(--line); }
.gauge::after { content: ""; position: absolute; left: 50%; top: 1px; width: 1px; height: 10px; background: var(--muted); }
.gauge i { position: absolute; top: 2.5px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: currentColor; }
.gauge.low { color: var(--below); }
.gauge.high { color: var(--above); }
.na { color: var(--muted); font-size: 0.82rem; }
.pill { font-size: 0.76rem; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.check { background: var(--below-soft); color: var(--below); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.camp-sum { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.camp-sum .big { font-family: var(--f-serif); font-weight: 400; font-size: 3rem; line-height: 1; letter-spacing: -0.02em; }
.camp-sum span { color: var(--muted); }
tr.pick { cursor: pointer; }
tr.pick td { transition: background 0.12s; }
tr.pick:hover td, tr.pick:focus-visible td { background: var(--hover); }
tr.pick:focus-visible { outline: none; }
td .tin { display: block; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.more { justify-self: start; }
.status { color: var(--muted); padding: 28px 0; }

.foot { margin-top: 72px; }
body.home .foot { margin-top: 40px; }
body.home .foot .scene { display: none; }
/* Under the lede: how much the payer's files cover. Footer: who runs the site, one quiet line. */
.fine { margin: 14px 0 0; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
body:not(.home) .fine { display: none; }
.disc { margin: 0; padding: 16px 0 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.78rem; }
body:not(.home) .disc { display: none; }

@media (max-width: 700px) {
  .tabs { gap: 14px; }
  .tabs button { font-size: 0.82rem; }
  body.home .intro { grid-template-columns: minmax(0, 1fr); padding-top: 22px; }
  .email { padding: 18px; }
  .c-place, .c-peers, .c-net, .gauge { display: none; }
  table { font-size: 0.84rem; }
  td, th { padding-left: 5px; padding-right: 5px; }
  th { white-space: normal; }
  .gap { min-width: 0; }
  .scene.low { height: 120px; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.35s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
}

/* Office view */
.sheet h2 { font-family: var(--f-serif); font-weight: 400; font-size: clamp(1.9rem, 4vw, 2.7rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 10px; text-wrap: balance; }
.sheet .facts { display: block; }
.lede { color: var(--muted); font-size: 0.98rem; margin: 10px 0 0; max-width: 46ch; }
body:not(.home) .lede { display: none; }
.answer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px 40px; align-items: flex-end; }
.answer p { margin: 0; font-family: var(--f-serif); font-size: clamp(1.35rem, 2.6vw, 1.8rem); line-height: 1.25; letter-spacing: -0.01em; max-width: 30ch; text-wrap: pretty; }
.answer p b { font-weight: 500; color: var(--below); }
.answer.ok p b { color: var(--above); }
.cta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px 32px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
.cta h3 { font-family: var(--f-serif); font-weight: 400; font-size: 1.5rem; letter-spacing: -0.01em; margin: 0 0 6px; }
.cta p { margin: 0; color: var(--muted); max-width: 58ch; }
a.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 11px 18px; white-space: nowrap; }
.note { color: var(--muted); font-size: 0.8rem; margin: 0; }
</style>

<script>
// The landscape. Five ridgelines, each hatched with lines that follow its own crest, the way a banknote
// engraver shades a hill: line weight carries the tone. Drawn once into a mask; CSS supplies the ink.
(function scene() {
  const W = 1600, H = 620, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d"), img = ctx.createImageData(W, H), d = img.data;
  const rnd = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const n1 = (v, seed) => { const i = Math.floor(v), f = v - i, u = f * f * (3 - 2 * f); return rnd(i + seed) * (1 - u) + rnd(i + 1 + seed) * u; };
  const fbm = (v, s) => n1(v, s) * 0.55 + n1(v * 2.1, s + 17) * 0.27 + n1(v * 4.3, s + 41) * 0.12 + n1(v * 9.1, s + 73) * 0.06;
  const L = 5, ridge = [];
  for (let l = 0; l < L; l++) {
    const a = new Float32Array(W), base = H * (0.40 + l * 0.125), amp = H * (0.34 - l * 0.045), fr = (4.5 + l * 2.2) / W;
    for (let i = 0; i < W; i++) {
      let v = fbm(i * fr + l * 10, l * 100 + 5);
      if (l < 3) v = Math.pow(1 - Math.abs(2 * v - 1), 1.4);
      a[i] = base - v * amp;
    }
    ridge.push(a);
  }
  const at = (a, i) => a[Math.max(0, Math.min(W - 1, Math.round(i)))];
  const sunX = W * 0.74, sunY = H * 0.2, sunR = 54;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let l = L - 1;
    while (l >= 0 && y < ridge[l][x]) l--;
    let alpha = 0;
    if (l < 0) {
      const dx = x - sunX, dy = y - sunY, r = Math.sqrt(dx * dx + dy * dy);
      if (r > sunR + 5) {
        const sp = 5, row = Math.floor(y / sp);
        let t = 0.5 * (1 - y / (H * 0.5));
        t *= 0.45 + 0.9 * n1(x * 0.012 + row * 7.3, 9);
        if (t > 0.04) alpha = Math.max(0, Math.min(1, t * sp * 0.5 - Math.abs((y / sp - row) - 0.5) * sp + 0.5));
      } else if (r > sunR) alpha = 1 - Math.abs(r - sunR - 1.2) / 1.2;
    } else {
      const a = ridge[l], depth = y - a[x], sp = 4.6 + l * 1.15, sx = x - depth * 0.7;
      const slope = at(a, sx + 3) - at(a, sx - 3);
      let t = 0.26 + l * 0.11 + Math.max(-0.3, Math.min(0.4, slope * 0.09));
      const k = Math.min(1, depth / (H * 0.2));
      t *= 1 - (l === L - 1 ? 0.35 : 0.8) * k * k * (3 - 2 * k);
      t = Math.max(0.05, Math.min(0.95, t));
      const ph = depth / sp;
      alpha = depth < 1.5 ? 1 : Math.max(0, Math.min(1, t * sp * 0.5 - Math.abs((ph - Math.floor(ph)) - 0.5) * sp + 0.5));
    }
    d[(y * W + x) * 4 + 3] = Math.max(0, alpha) * 255;
  }
  ctx.putImageData(img, 0, 0);
  document.documentElement.style.setProperty("--scene", `url(${c.toDataURL("image/png")})`);
})();


const $ = (id) => document.getElementById(id);
/* One page, several payers. Each payer's published rates are one export in a folder of its own:
     payers.json                      [{key, label, short, file_month, practices, path?}, ...]
                                      key is [a-z0-9_-]; the default payer is "uhc", else the first entry;
                                      path (optional) is the payer's folder, "payers/<key>/" when absent.
     <folder>index.json               {meta: {payer, networks, specialties, file_month, also?, ...},
                                       groups: [[id, name, state, spec, org, mask, share, aliases, counts, nspec, verified,
                                                 city, reason?, note?, also?], ...]}
     <folder>states/<ST>-<shard>.json {<network index>: {<group id>: [[code, rate, median, peers, rank, vol, medicare, mixed], ...]}}
   mask: the practice's networks, a bitmask over meta.networks or a list of their indexes (a Blue plan may have many).
   also: the other payers' keys that list the same organization NPI; read when meta.also is true, otherwise the other
   payers' indexes are fetched in the background to find it.
   Without payers.json the page reads ./index.json and ./states/ as UnitedHealthcare (the single-payer deploy). */
// p: the chosen payer; d: its loaded index (null while it loads); meta, groups and byId are d's.
const S = { payers: [], def: null, p: null, d: null, err: false, ready: {}, loading: {},
  meta: null, groups: [], byId: new Map(), cur: null, hits: [], cursor: -1, tok: 0 };
const cents = (v) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const title = (s) => /[a-z]/.test(s) ? s : s.toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g, (m, a, b) => a + b.toUpperCase())
  .replace(/\b(Md|Pa|Pc|Llc|Pllc|Llp|Lp|Dba|Usa|Ii|Iii)\b/g, (m) => m.toUpperCase());
// Payers' files abbreviate ("Vitreous Retina Macula Cons of NY"): both sides are spelled out before matching.
const ABBR = { cons: "consultants", consult: "consultants", assoc: "associates", assocs: "associates", asso: "associates",
  med: "medical", grp: "group", ctr: "center", cntr: "center", svc: "services", svcs: "services", inst: "institute",
  hlth: "health", mgmt: "management", ophth: "ophthalmology", opth: "ophthalmology", surg: "surgery", spec: "specialists" };
const norm = (s) => s.toLowerCase().replace(/&/g, " and ").replace(/orthopaedic/g, "orthopedic")
  .replace(/[^a-z0-9]+/g, " ").trim().split(" ").filter(Boolean).map((w) => ABBR[w] || w)
  .map((w) => (w.length > 3 && w.endsWith("s") ? w.slice(0, -1) : w));
// A state typed as words ("... of New York") may be the practice's state rather than part of its name.
const STATES = { alabama: "AL", alaska: "AK", arizona: "AZ", arkansas: "AR", california: "CA", colorado: "CO", connecticut: "CT",
  delaware: "DE", "district of columbia": "DC", florida: "FL", georgia: "GA", hawaii: "HI", idaho: "ID", illinois: "IL",
  indiana: "IN", iowa: "IA", kansa: "KS", kentucky: "KY", louisiana: "LA", maine: "ME", maryland: "MD", massachusett: "MA",
  michigan: "MI", minnesota: "MN", mississippi: "MS", missouri: "MO", montana: "MT", nebraska: "NE", nevada: "NV",
  "new hampshire": "NH", "new jersey": "NJ", "new mexico": "NM", "new york": "NY", "north carolina": "NC", "north dakota": "ND",
  ohio: "OH", oklahoma: "OK", oregon: "OR", pennsylvania: "PA", "rhode island": "RI", "south carolina": "SC",
  "south dakota": "SD", tennessee: "TN", texa: "TX", utah: "UT", vermont: "VT", virginia: "VA", washington: "WA",
  "west virginia": "WV", wisconsin: "WI", wyoming: "WY" };
function stateWords(words) {
  // {word: state code} for the words of a state name in the query (normalized words: "texa", "kansa" as norm leaves them)
  const out = {}, line = " " + words.join(" ") + " ";
  for (const [nm, code] of Object.entries(STATES).sort((a, b) => b[0].length - a[0].length)) {
    if (line.includes(" " + nm + " ")) nm.split(" ").forEach((x) => { if (!(x in out)) out[x] = code; });
  }
  return out;
}
const spec = (g) => S.meta.specialties[g.spec];
const netsOf = (g) => Array.isArray(g.mask) ? g.mask.slice()
  : S.meta.networks.map((n, i) => i).filter((i) => Math.floor(g.mask / 2 ** i) % 2 === 1);
const poss = (s) => s + (/s$/i.test(s) ? "'" : "'s");
// "a urology practice", "a university", "an obstetrics practice" (a "you" sound takes "a"; Anthem audit round 6).
const art = (w) => (/^([aeio]|u(?!ro|ni|s[aeiu]|tah))/i.test(w) ? "an" : "a");
// Blue plans' network labels read "HCSC: BCBS Texas : Blue Choice"; shown as "BCBS Texas · Blue Choice".
const netName = (s) => String(s).replace(/^[^:]+: (?=.+ : )/, "").replace(/ : /g, " · ");
// The same organization in a payer's file: its compared listing first.
const byOrg = (d, org) => { const a = org && d.byOrg.get(org); return a ? a.find((g) => !g.reason) || a[0] : null; };

function load(P) {
  if (!S.loading[P.key]) S.loading[P.key] = fetch(P.base + "index.json").then((res) => {
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }).then((data) => {
    // Practices are keyed by organization NPI or a practice number; the public files carry no tax IDs.
    // verified: the practice's verdict holds after the geography check (site gate); otherwise its rates are shown alone.
    // reason: a group listed without a comparison (a hospital's staff, a multi-state platform, mixed specialties...).
    // note: why a compared practice's state was chosen (e.g. its organization NPI's state, for remote readers).
    const d = { meta: data.meta, shards: {}, byId: new Map(), byOrg: new Map() };
    d.groups = data.groups.map(([id, name, state, sp, org, mask, share, aliases, counts, nspec, verified, city, reason, note, also]) => ({
      id, name: name || "Unnamed practice", state, spec: sp, org: org || "", mask, counts: counts || [], city: city || "",
      verified: verified === 1, reason: (typeof reason === "number" ? (data.meta.reasons || [])[reason] : reason) || "", note: note || "",
      also: Array.isArray(also) ? also : also ? String(also).split("|") : [],
      key: " " + norm([name, aliases].join(" ")).join(" ") + " ", nkey: " " + norm(name || "").join(" ") + " ",
      sq: norm([name, aliases].join(" ")).join(""),  // "vitreoretinal" is in "vitreo retinal"
      aka: String(aliases || "").split("|").filter(Boolean),
    }));
    d.groups.forEach((g) => {
      d.byId.set(g.id, g);
      if (g.org) { if (!d.byOrg.has(g.org)) d.byOrg.set(g.org, []); d.byOrg.get(g.org).push(g); }
    });
    if (P.legacy && d.meta.payer) P.label = d.meta.payer;
    return (S.ready[P.key] = d);
  }).catch((e) => { delete S.loading[P.key]; throw e; });
  return S.loading[P.key];
}

// Choose a payer: its wording at once, its index when loaded. Resolves to its data, or null if another was chosen meanwhile.
async function setPayer(P) {
  S.p = P; S.err = false;
  if (S.ready[P.key]) use(S.ready[P.key]); else S.d = null;
  paint();
  let d;
  try { d = await load(P); } catch (e) { if (S.p === P) S.err = true; throw e; }
  if (S.p !== P) return null;
  use(d); paint();
  return d;
}
function use(d) { S.d = d; S.meta = d.meta; S.groups = d.groups; S.byId = d.byId; }

function renderPicker() {
  $("payers").hidden = S.payers.length < 2;
  $("seg").innerHTML = S.payers.map((p) => `<label><input type="radio" name="payer" value="${esc(p.key)}"><span class="opt">${esc(p.short)}${
    p.short !== p.label ? `<span class="vh"> (${esc(p.label)})</span>` : ""}</span></label>`).join("");
  const names = S.payers.map((p) => p.label), list = names.length > 1 ? names.slice(0, -1).join(", ") + " and " + names[names.length - 1] : names[0];
  document.querySelector('meta[name="description"]').content = `See your practice's published ${list} rates next to the typical rate for your specialty in your state.`;
}
// Every line that names the payer, from the chosen one.
function paint() {
  const P = S.p, d = S.ready[P.key];
  document.querySelectorAll("#seg input").forEach((i) => { i.checked = i.value === P.key; });
  $("hl").textContent = `Is ${P.short} paying you less than practices like yours?`;
  $("lede").textContent = `Your published ${P.label} rates next to the typical rate for your specialty in your state.`;
  $("disc").textContent = `Payor Rate Check is run by RSK Health and is not affiliated with ${P.label}.`;
}

// The address names the payer (when not the default) and the practice: ?payer=<key>#p-<id>. An outreach ?npi= stays
// while its own practice is shown.
function syncUrl(g) {
  let q;
  try { q = new URLSearchParams(location.search); } catch (e) { q = new URLSearchParams(); }
  if (S.p === S.def) q.delete("payer"); else q.set("payer", S.p.key);
  const npi = (q.get("npi") || "").replace(/\D/g, "");
  if (q.has("npi") && !(g && npi && (npi === g.id || npi === g.org))) q.delete("npi");
  const s = q.toString();
  history.replaceState(null, "", location.pathname + (s ? "?" + s : "") + (g ? "#p-" + g.id : ""));
}
function home() {
  S.tok++; S.cur = null;
  $("sheet").hidden = true;
  document.body.classList.add("home");
  syncUrl(null);
}

async function boot() {
  let list = null;
  try { const res = await fetch("payers.json"); if (res.ok) list = await res.json(); } catch (e) { /* one payer, at the root */ }
  if (list && !Array.isArray(list)) list = list.payers;
  S.payers = (Array.isArray(list) ? list : []).filter((p) => p && /^[a-z0-9_-]+$/.test(p.key || "")).map((p) => {
    const label = String(p.label || p.key.toUpperCase());
    const base = p.path != null ? String(p.path).replace(/\/?$/, "/").replace(/^\/$/, "") : `payers/${p.key}/`;
    return { key: p.key, label, short: String(p.short || label), file_month: p.file_month || "", practices: p.practices || 0, base };
  });
  if (!S.payers.length) S.payers = [{ key: "uhc", label: "UnitedHealthcare", short: "UHC", file_month: "", practices: 0, base: "", legacy: true }];
  S.def = S.payers.find((p) => p.key === "uhc") || S.payers[0];
  // An outreach link opens on its practice: ?npi=<organization NPI>, with &payer=<key> for another payer than the default;
  // a shared result uses #p-<id>.
  let q = null;
  try { q = new URLSearchParams(location.search); } catch (e) { /* no query string */ }
  const want = q && (q.get("payer") || "").toLowerCase();
  renderPicker();
  try { await setPayer(S.payers.find((p) => p.key === want) || S.def); } catch (e) {
    $("sheet").hidden = false;
    $("sheet").innerHTML = '<div class="status">The rates did not load. Reload the page to try again.</div>';
    return;
  }
  const npi = q && (q.get("npi") || "").replace(/\D/g, "");
  // Practice results are for lookup, not search engines: a personal link's page is marked noindex.
  if (npi || location.hash) {
    const robots = document.createElement("meta");
    robots.name = "robots"; robots.content = "noindex";
    document.head.appendChild(robots);
  }
  const m = location.hash.match(/^#p-(\w+)$/);
  const g = (npi && (S.byId.get(npi) || byOrg(S.d, npi))) || (m && S.byId.get(m[1]));
  if (g) show(g); else { document.body.classList.add("home"); $("q").focus(); }
}

// Switch payers from the picker or a practice's "see its rates" link: the same practice there when it is listed.
async function switchPayer(key, focus) {
  const P = S.payers.find((p) => p.key === key);
  if (!P || P === S.p) return;
  const was = S.cur, tok = ++S.tok;
  S.cur = null;
  if (was) { $("sheet").hidden = false; $("sheet").innerHTML = `<div class="status">Loading ${esc(P.label)} rates…</div>`; }
  const loading = setPayer(P), typed = () => !was && $("q").value.trim();
  if (typed()) search(); // the new payer's matches, or a loading line until its index arrives
  let d;
  try { d = await loading; } catch (e) {
    if (tok !== S.tok) return;
    $("sheet").hidden = false;
    $("sheet").innerHTML = `<div class="status">The ${esc(P.label)} rates did not load. Reload the page to try again.</div>`;
    if (typed()) search();
    return;
  }
  if (!d || tok !== S.tok) return;
  const g = was && byOrg(d, was.org);
  if (g) {
    await show(g);
    const h = S.cur === g && $("sheet").querySelector("h2");
    if (focus && h) h.focus();
  } else if (was) {
    syncUrl(null);
    $("sheet").innerHTML = `<div class="status">${esc(title(was.name))} isn't in ${esc(poss(P.label))} published rate files. Search above for another practice.</div>`;
  } else { home(); if (typed()) search(); }
}

// One file per state and bucket of specialties: <folder>states/XX-n.json (n is the specialty's shard).
async function shard(g) {
  const d = S.d, k = `${g.state || "XX"}-${spec(g).shard || 0}`;
  if (!d.shards[k]) {
    const res = await fetch(`${S.p.base}states/${k}.json`);
    if (!res.ok) throw new Error(res.status);
    d.shards[k] = await res.json();
  }
  return d.shards[k];
}
function defaultNet(g) {
  let best = netsOf(g)[0], n = -1;
  netsOf(g).forEach((i) => { if ((g.counts[i] || 0) > n) { best = i; n = g.counts[i] || 0; } });
  return best;
}
// Same comparison rules as the sales lookup and ratedb.py.
function rowsFor(g, ni, data) {
  const sp = spec(g), m = S.meta, held = new Set(m.held || []);
  return ((data[ni] || {})[g.id] || []).map(([code, rate, med, peers, rank, vol, mcr, mixed, cms, uni]) => {
    const gap = med ? (med - rate) / med * 100 : null;
    const hold = med != null && (held.has(`${g.state}|${code}|${ni}`) || held.has(`${g.state}|${code}|${ni}|${sp.key}`));
    const surgeon = sp.facility_codes.includes(code);
    const check = med != null && !hold && (rate < m.flag_pct_of_median / 100 * med || (!surgeon && mcr && rate < m.flag_pct_of_medicare / 100 * mcr) || (!!mixed && m.mixed_rate !== "highest"));
    const compared = med != null && !hold && !check;
    return { code, desc: sp.codes[code] || code, rate, med, peers, gap, vol: vol || 0, surgeon, compared, mixed: !!mixed, uni: !!uni,
      below: compared && gap >= m.min_gap_pct, order: sp.code_order.indexOf(code) };
  }).sort((a, b) => b.compared - a.compared || b.below - a.below || a.order - b.order);
}
// The payer's visits per Medicare visit: per code where set (Medicare-heavy procedures), else the specialty's.
const shareOf = (sp, code) => (sp.share_by_code && sp.share_by_code[code]) || sp.share_of_medicare || sp.uhc_share_of_medicare;
function annualFor(g, rows) {
  // Office codes only where the specialty says so (hospital visits are not office volume).
  const sp = spec(g);
  const v = rows.filter((r) => r.below && (!sp.annual_codes || sp.annual_codes.includes(r.code))).reduce((a, r) => a + (r.med - r.rate) * r.vol * shareOf(sp, r.code), 0);
  const step = v < 10000 ? 100 : 1000;
  return Math.round(v / step) * step;
}
const gauge = (r) => `<span class="gauge ${r.below ? "low" : r.gap < 0 ? "high" : ""}" aria-hidden="true"><i style="left:${50 - Math.max(-30, Math.min(30, r.gap)) / 30 * 46}%"></i></span>`;

// Other payers that list the same organization NPI, each a link to this practice's rates there.
const ALSO = '<nav class="also" id="also" aria-label="This practice with other payers" hidden></nav>';
function fillAlso(g, tok) {
  const others = S.payers.filter((p) => p !== S.p);
  if (!g.org || !others.length) return;
  const yes = new Set(), hinted = !!S.meta.also;
  const draw = () => {
    const el = $("also");
    if (tok !== S.tok || !el) return;
    const ps = others.filter((p) => yes.has(p.key));
    el.hidden = !ps.length;
    el.innerHTML = ps.map((p) => `<a href="?payer=${encodeURIComponent(p.key)}&amp;npi=${encodeURIComponent(g.org)}" data-payer="${esc(p.key)}">See this practice's ${esc(p.label)} rates <span aria-hidden="true">→</span></a>`).join("");
  };
  others.forEach((p) => {
    const d = S.ready[p.key];
    if (d) { if (byOrg(d, g.org)) yes.add(p.key); }
    else if (hinted) { if (g.also.includes(p.key)) yes.add(p.key); }
    else load(p).then((d) => { if (byOrg(d, g.org)) { yes.add(p.key); draw(); } }, () => {});
  });
  draw();
}

async function show(g, ni) {
  const tok = ++S.tok, U = S.p.short, L = S.p.label;
  S.cur = g;
  document.body.classList.remove("home");
  $("results").hidden = true;
  $("sheet").hidden = false;
  if (g.reason) {
    // Listed, not compared: every group in the file is listed, and one that can't be compared fairly says why.
    syncUrl(g);
    const why = g.reason.charAt(0).toUpperCase() + g.reason.slice(1), label = spec(g).label;
    // A practice type still in its own audit (publish_tiers.json) is not an unfair comparison: say it is in review.
    const review = /^comparisons for this practice type are in review/i.test(g.reason);
    $("sheet").innerHTML = `<h2 tabindex="-1">${esc(title(g.name))}</h2>
      <p class="sub">${review ? esc(label.charAt(0).toUpperCase() + label.slice(1)) + " · " : ""}${esc(g.city ? title(g.city) + ", " : "")}${esc(g.state)}${g.org ? " · NPI " + esc(g.org) : ""}</p>
      ${ALSO}
      ${review ? `<div class="listed"><p>We list every group in ${esc(poss(L))} published rate files. We're still checking
      comparisons for ${esc(label)} practices, so we don't show this one's rates yet.</p>` : `<div class="listed"><p>We list every group in ${esc(poss(L))} published rate files, but we don't compare this one
      with independent practices in ${esc(g.state)}, because a side-by-side wouldn't be fair.</p>
      <p><strong>Why:</strong> ${esc(why)}.</p>`}
      <p>RSK can still check what ${esc(U)} actually paid you against your own contract.</p></div>
      <div class="cta"><a class="btn" href="https://www.rsk.com/practices/rsk-health#health-review" target="_blank" rel="noopener">Request a confidential review <span aria-hidden="true">→</span></a></div>
      <p class="note">From ${esc(poss(L))} published negotiated-rate files. Payor Rate Check is run by RSK Health, 200 E. Van Buren St., Suite 600, Phoenix, AZ 85004, and is not affiliated with ${esc(L)}. To correct or remove a listing, use the review request link above or write to that address.</p>`;
    fillAlso(g, tok);
    return;
  }
  if (ni == null) ni = defaultNet(g);
  $("sheet").innerHTML = '<div class="status">Loading your rates…</div>';
  let data;
  try { data = await shard(g); } catch (e) { if (tok === S.tok) $("sheet").innerHTML = '<div class="status">Your rates did not load. Try again.</div>'; return; }
  if (tok !== S.tok) return;
  syncUrl(g);
  const m = S.meta, sp = spec(g);
  const rows = rowsFor(g, ni, data);
  const compared = rows.filter((r) => r.compared).length, below = rows.filter((r) => r.below).length;
  // A yearly figure only where its volume ratio was checked (orthopedics, ophthalmology); elsewhere it would be an
  // assumption shown in public.
  // Site gate (as for emails): a verdict, peer column and yearly figure only where the comparison holds after the
  // geography check; otherwise the practice's published rates alone.
  const gated = !g.verified;
  const annual = sp.annual_in_email && !gated ? annualFor(g, rows) : 0;
  const prac = / practice$/.test(sp.label) ? sp.label : sp.label + " practice";
  const where = `${prac}${g.state ? " in " + esc(g.state) : ""}`;
  const answer = gated
    ? `<div class="answer ok"><p>These are your published ${esc(U)} rates. We haven't verified a peer comparison for your practice yet; RSK can check them against what ${esc(U)} actually paid you.</p></div>`
    : compared && rows.every((r) => !r.compared || r.uni)
    // One fee schedule for everyone (BCBS Michigan pays all 94 MI ophthalmology practices $149.92 for 92014):
    // "at or above the typical rate" would say nothing (Aaron, 2026-11-12).
    ? `<div class="answer ok"><p>${esc(U)} pays every ${esc(prac)} in ${esc(g.state)} on this network the same published rate for these codes: one fee schedule for all, so there's no gap between practices to find. RSK can still check what ${esc(U)} actually paid you against it.</p></div>`
    : !compared
    ? `<div class="answer ok"><p>These are your published ${esc(U)} rates. We don't have a fair peer comparison for your practice on this network yet; RSK can check them against what ${esc(U)} actually paid you.</p></div>`
    : below
      ? `<div class="answer"><p>On <b>${below} of ${compared}</b> codes we checked, ${esc(U)} pays you at least ${m.min_gap_pct}% less than the typical ${where}.</p>
         ${annual > 0 ? `<div class="money"><span class="amt">≈ $${annual.toLocaleString("en-US")}</span><span>a year, if your ${esc(U)} volume is typical</span></div>` : ""}</div>`
      // A code under 10% below is not "below", but the sentence must not say "at or above" while a row shows -4%
      // (BCBS audit, 2026-11-12).
      : rows.some((r) => r.compared && r.gap >= 0.5)
      ? `<div class="answer ok"><p>${esc(U)} pays you <b>within ${m.min_gap_pct}% of the typical rate, or above it,</b> for ${art(sp.label)} ${where} on every code we checked.</p></div>`
      : `<div class="answer ok"><p>${esc(U)} pays you <b>at or above the typical rate</b> for ${art(sp.label)} ${where} on every code we checked.</p></div>`;
  const nets = netsOf(g);
  $("sheet").innerHTML = `
    <div><h2 tabindex="-1">${esc(title(g.name))}</h2>
      <div class="facts">${esc(sp.label[0].toUpperCase() + sp.label.slice(1))}${g.city ? " · " + esc(title(g.city)) : ""}${g.state ? ", " + esc(g.state) : ""}${g.org ? " · NPI " + esc(g.org) : ""}</div>
      ${ALSO}</div>
    ${answer}
    ${nets.length > 1 ? `<div class="netpick"><label for="net">${esc(U)} network</label><select id="net">${nets.map((i) => `<option value="${i}"${i === ni ? " selected" : ""}>${esc(netName(m.networks[i]))}</option>`).join("")}</select></div>`
      : nets.length ? `<div class="netpick"><span>${esc(U)} network</span> <b>${esc(netName(m.networks[nets[0]]))}</b></div>` : ""}
    <div class="tablewrap"><table>
      <thead><tr><th>Code</th><th>Service</th><th class="num">Your rate</th>${gated ? "" : `<th class="num">Typical in ${esc(g.state)}</th><th class="num">Difference</th><th class="num c-peers">Practices compared</th>`}</tr></thead>
      <tbody>${rows.map((r) => `<tr><td class="code">${r.code}</td><td>${esc(r.desc)}${r.surgeon && !r.code.includes("-") ? ' <span class="na">(in-facility rate)</span>' : ""}</td>
        <td class="num">${cents(r.rate)}${r.mixed ? `<span class="na lowest">one of several published rates${S.meta.mixed_rate === "highest" ? " (highest shown)" : ""}</span>` : ""}</td>${gated ? "" : `
        <td class="num">${r.compared ? cents(r.med) : '<span class="na">not compared</span>'}</td>
        <td class="num">${r.compared ? `<span class="gapcell">${gauge(r)}<span class="gap ${r.below ? "low" : r.gap < 0 ? "high" : ""}">${Math.trunc(r.gap) === 0 ? "" : r.gap > 0 ? "−" : "+"}${Math.abs(Math.trunc(r.gap))}%</span></span>` : ""}</td>
        <td class="num c-peers">${r.compared ? r.peers : ""}</td>`}</tr>`).join("")}</tbody>
    </table></div>
    <div class="cta"><div><h3>Want to know what ${esc(U)} actually paid you?</h3>
      <p>These are the rates ${esc(U)} agreed to. RSK checks your remittances for claims paid below even this rate, and helps when your contract comes up for renewal.</p></div>
      <a class="btn" href="https://www.rsk.com/practices/rsk-health#health-review" target="_blank" rel="noopener">Request a confidential review <span aria-hidden="true">→</span></a></div>
    ${g.note ? `<p class="note">${esc(g.note)}</p>` : ""}
    <p class="note">From ${esc(poss(L))} published negotiated-rate files${m.file_month ? ", " + esc(m.file_month) : ""}.${annual > 0 ? ` The yearly figure is an estimate at typical ${esc(U)} volume for a practice your size.` : ""} Payor Rate Check is run by RSK Health, 200 E. Van Buren St., Suite 600, Phoenix, AZ 85004, and is not affiliated with ${esc(L)}. To correct or remove a listing, use the review request link above or write to that address.</p>`;
  const sel = $("net"); if (sel) sel.onchange = (e) => show(g, +e.target.value);
  fillAlso(g, tok);
}

// A result found through another name the payer or the NPI registry uses ("Virginia Eye Institute Inc" for Eye
// Surgeons of Richmond, Inc.) says so, or it looks like a miss (Aaron, 2026-11-12).
function viaAlias(g, sig) {
  if (!sig.length || sig.every((x) => g.nkey.includes(" " + x))) return "";
  const a = g.aka.find((n) => { const k = " " + norm(n).join(" ") + " "; return sig.every((x) => k.includes(" " + x)); });
  return a ? ` · also listed as ${esc(title(a))}` : "";
}
const STOP = new Set(["the", "of", "and", "at", "for", "a", "an", "in", "inc", "llc", "pllc", "pc", "pa", "md", "ltd", "co", "corp"]);
function search() {
  const raw = $("q").value.trim(), box = $("results");
  if (!raw) { box.hidden = true; S.hits = []; home(); return; }
  if (raw.length < 2) { box.hidden = true; return; }
  if (!S.d) {
    S.hits = []; S.cursor = -1;
    box.innerHTML = `<div class="none">${S.err ? `The ${esc(S.p.label)} rates did not load. Reload the page to try again.` : `Loading ${esc(S.p.label)} rates…`}</div>`;
    box.hidden = false;
    return;
  }
  const digits = raw.replace(/[\s-]/g, "");
  let hits, closest = false, sigUsed = [];
  if (/^\d{3,}$/.test(digits)) hits = S.groups.filter((g) => g.org && g.org.startsWith(digits));
  else {
    // Best matches first: the name starts with what was typed (a leading "the" ignored), then those words in that
    // order anywhere, then the rest; compared practices before listed-only groups; then by name.
    // A name that starts with exactly what was typed ("the nephrology group") comes before one that matches only
    // without the "the" (Nephrology Group Consultants).
    const typed = " " + norm(raw).join(" ") + " ";
    const w = norm(raw).filter((x, i) => !(i === 0 && x === "the")), phrase = " " + w.join(" ") + " ";
    const lead = (g) => g.key.replace(/^ the /, " ");
    const rank = (g) => (g.key.startsWith(typed) ? 0 : lead(g).startsWith(phrase) ? 1 : g.key.includes(phrase) ? 2 : 3) * 2
      + (g.reason ? 1 : 0);
    // Filler words ("of", "the", "inc"...) need not match; when no name has every other word, the closest names
    // (most of the words) are offered: "Retina Center of San Diego" finds "Retina San Diego" (Aaron, 2026-11-12).
    const sig = w.some((x) => !STOP.has(x)) ? w.filter((x) => !STOP.has(x)) : w;
    sigUsed = sig;
    const stw = stateWords(sig);
    const has = (g, x) => g.key.includes(" " + x) || (stw[x] && g.state === stw[x]) || (x.length >= 6 && g.sq.includes(x));
    hits = S.groups.filter((g) => sig.every((x) => has(g, x)))
      .sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
    if (!hits.length && sig.length > 1) {
      // A rare word counts for more than a common one: "retina" over "center" or "San Diego".
      const need = Math.max(2, Math.ceil(sig.length * 0.6)), df = sig.map(() => 0);
      const found = S.groups.map((g) => { const m = sig.map((x) => has(g, x)); m.forEach((y, i) => { if (y) df[i]++; }); return [g, m]; });
      const idf = df.map((d) => Math.log((S.groups.length + 1) / (d + 1)));
      hits = found.filter((p) => p[1].filter(Boolean).length >= need)
        .map((p) => [p[0], p[1].reduce((t, y, i) => t + (y ? idf[i] : 0), 0)])
        .sort((a, b) => b[1] - a[1] || rank(a[0]) - rank(b[0]) || a[0].name.localeCompare(b[0].name)).map((p) => p[0]);
      closest = hits.length > 0;
    }
  }
  S.hits = hits.slice(0, 30); S.cursor = -1;
  // Not here, or only near misses: offer the other payers' files, where the practice may be (Aaron, 2026-11-12:
  // San Diego retina practices are in Anthem's files, not UHC's).
  const others = S.payers.filter((p) => p !== S.p);
  const tryOthers = (!S.hits.length || closest) && others.length ? `<div class="none tryp">Not finding it? Search ${
    others.map((p) => `<button type="button" data-try="${esc(p.key)}">${esc(p.label)}</button>`).join(" · ")}</div>` : "";
  box.innerHTML = (closest ? `<div class="none">No exact match for "${esc(raw)}". Closest names:</div>` : "") +
    (S.hits.length ? S.hits.map((g, i) => `<button type="button" role="option" data-i="${i}"><span class="nm">${esc(title(g.name))}</span>
      <span class="tag">${esc(g.city ? title(g.city) + ", " : "")}${esc(g.state)}</span><span class="sub">${esc(spec(g).label)}${g.org ? " · NPI " + esc(g.org) : ""}${viaAlias(g, sigUsed)}</span></button>`).join("")
    : `<div class="none">We couldn't find "${esc(raw)}" in ${esc(poss(S.p.label))} published rates. Try your organization NPI.</div>`) + tryOthers;
  box.hidden = false;
}
function pick(i) { const g = S.hits[i]; if (!g) return; $("q").value = title(g.name); show(g); }
$("q").addEventListener("input", search);
$("q").addEventListener("keydown", (e) => {
  const btns = [...$("results").querySelectorAll("button")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!btns.length) return;
    S.cursor = (S.cursor + (e.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.classList.toggle("on", i === S.cursor)); btns[S.cursor].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") pick(S.cursor >= 0 ? S.cursor : 0);
  else if (e.key === "Escape") $("results").hidden = true;
});
$("results").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]"); if (b) pick(+b.dataset.i);
  const t = e.target.closest("button[data-try]"); if (t) switchPayer(t.dataset.try);
});
$("go").addEventListener("click", () => { if (S.hits.length) pick(S.cursor >= 0 ? S.cursor : 0); else $("q").focus(); });
// The picker is a radio group (arrow keys move through it); a short pause lets arrowing past a payer skip its download.
let pend;
$("seg").addEventListener("change", (e) => { clearTimeout(pend); const k = e.target.value; pend = setTimeout(() => switchPayer(k), 150); });
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search")) $("results").hidden = true;
  // A practice's link to its rates with another payer switches in place (a modified click opens the deep link).
  const a = e.target.closest("a[data-payer]");
  if (a && !e.button && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) { e.preventDefault(); switchPayer(a.dataset.payer, true); }
});
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#p-(\w+)$/); if (m && S.d && S.byId.has(m[1])) show(S.byId.get(m[1])); });
boot();
</script>
